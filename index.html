<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>W wolnej chwili</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* MAPA */
#map {
  height: 100vh;
}

/* HEADER */
.header {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
}

.logo {
  background: rgba(255,255,255,0.9);
  padding: 10px 15px;
  border-radius: 12px;
  font-weight: bold;
  backdrop-filter: blur(6px);
}

/* FILTRY */
.filters {
  display: flex;
  gap: 8px;
}

.filter {
  background: rgba(255,255,255,0.9);
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 14px;
}

/* PANEL */
#panel {
  position: fixed;
  bottom: -100%;
  left: 0;
  width: 100%;
  background: white;
  padding: 16px;
  transition: 0.3s ease;
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
}

#panel.open {
  bottom: 0;
}

#panel img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

/* BUTTON */
.btn {
  display: block;
  margin-top: 12px;
  padding: 12px;
  text-align: center;
  background: #2e7d32;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

/* HANDLE (ten pasek jak w aplikacji) */
.handle {
  width: 40px;
  height: 5px;
  background: #ccc;
  border-radius: 10px;
  margin: 0 auto 10px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">🌿 W wolnej chwili</div>

  <div class="filters">
    <div class="filter">🚴</div>
    <div class="filter">🏃</div>
    <div class="filter">👶</div>
  </div>
</div>

<div id="map"></div>

<div id="panel"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([51.0, 19.5], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const trasa = {
  name: "Przedbórz – Pilica",
  lat: 51.09,
  lng: 19.88,
  km: 60,
  elevation: 300,
  img: "https://picsum.photos/600/300",
  gpx: "#"
};

var marker = L.marker([trasa.lat, trasa.lng]).addTo(map);

marker.on('click', function () {
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="handle"></div>
    <h2>${trasa.name}</h2>
    <p>${trasa.km} km | ⛰️ ${trasa.elevation} m</p>
    <img src="${trasa.img}">
    <a href="${trasa.gpx}" class="btn">Pobierz GPX</a>
  `;

  panel.classList.add("open");
});
</script>

</body>
</html>
