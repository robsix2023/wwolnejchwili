<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>W wolnej chwili</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

/* 🔧 RESET */
* {
  box-sizing: border-box;
}

body {
margin: 0;
  font-family: Inter, Arial, sans-serif;
  background:
    linear-gradient(to bottom, #f8fafc, #eef2f7);
  overflow-x: hidden;
  color: #111827;
}

/* 🔝 LOGO WRAPPER */
.logo-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  padding: 20px 16px 10px;
}

/* 🖼️ LOGO */
.logo {
  width: 100%;
  max-width: 500px;
  height: auto;
  display: block;
}

/* 🧭 FILTRY */
#filters {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  justify-content: center;
  background: white;
  overflow-x: auto;
}

.filter {
  padding: 10px 14px;
  background: rgba(255,255,255,0.8);
  border-radius: 999px;
  font-size: 13px;
  white-space: nowrap;
  flex-shrink: 0;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.5);
  box-shadow:
    0 2px 6px rgba(0,0,0,0.06);
  transition: 0.2s;
}

.filter:hover {
  transform: translateY(-1px);
}

/* 🗺️ MAPA */
#map {
  width: 100%;
  height: 55vh;
}

/* 📦 PANEL */
#panel {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 120px;

  background:
    rgba(255,255,255,0.88);

  backdrop-filter: blur(18px);

  border-radius: 28px 28px 0 0;

  box-shadow:
    0 -10px 40px rgba(0,0,0,0.12);

  transition: 0.35s;

  overflow-y: auto;

  z-index: 1000;

  border-top:
    1px solid rgba(255,255,255,0.6);
}

#panel.open {
  height: 65vh;
}

/* 👆 UCHWYT */
#handle {
  width: 40px;
  height: 5px;
  background: #ccc;
  border-radius: 10px;
  margin: 10px auto;
}

#panelContent {
  padding: 12px 16px 20px;
}

#panel img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

/* 🧩 PRZYCISKI */
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 14px;

  text-align: center;

  background:
    linear-gradient(
      135deg,
      #0f3d2e,
      #1f6b52
    );

  color: white;

  text-decoration: none;

  border-radius: 16px;

  font-weight: 600;

  letter-spacing: 0.3px;

  box-shadow:
    0 8px 24px rgba(15,61,46,0.25);

  transition: 0.2s;
}

.btn:hover {
  transform: translateY(-2px);
}

/* 📄 SZCZEGÓŁY */
#details {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: white;
  overflow-y: auto;
  z-index: 2000;
}

#details header {
  padding: 15px;
  background: #f0f0f0;
  position: sticky;
  top: 0;
}

#details header button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: black;
  color: white;
}

#detailsContent {
  padding: 16px;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.gallery img {
  width: 100%;
  border-radius: 12px;
}

/* 💻 TABLET / LAPTOP */
@media (min-width: 768px) {

  #map {
  width: 100%;
  height: 55vh;
  border-radius: 28px 28px 0 0;
  overflow: hidden;
}

  #panel {
    width: 420px;
    right: 20px;
    left: auto;
    bottom: 20px;
    border-radius: 24px;
  }

  #panel.open {
    height: 70vh;
  }

  .gallery {
    grid-template-columns: 1fr 1fr;
  }

}

/* 🖥️ DUŻE EKRANY */
@media (min-width: 1200px) {

  .logo {
    max-width: 650px;
  }

  #map {
    height: 72vh;
  }

}

</style>
</head>

<body>

<!-- 🔝 LOGO SVG -->
<div class="logo-wrapper">
  <img src="logo.svg" alt="W wolnej chwili" class="logo">
</div>

<!-- 🧭 FILTRY -->
<div id="filters">
  <div class="filter">🚴 Rower</div>
  <div class="filter">🏃 Bieganie</div>
  <div class="filter">👶 Z dzieckiem</div>
</div>

<!-- 🗺️ MAPA -->
<div id="map"></div>

<!-- 📦 PANEL -->
<div id="panel">
  <div id="handle"></div>

  <div id="panelContent">
    <p>Kliknij trasę na mapie</p>
  </div>
</div>

<!-- 📄 SZCZEGÓŁY -->
<div id="details">

  <header>
    <button onclick="closeDetails()">⬅ Wróć</button>
  </header>

  <div id="detailsContent">

    <h2>Nazwa trasy</h2>

    <p>
      📏 42 km <br>
      ⛰️ 240 m przewyższenia
    </p>

    <div class="gallery">
      <img src="https://picsum.photos/600/400">
      <img src="https://picsum.photos/601/400">
    </div>

    <p>
      Tutaj będzie opis trasy.
      Możesz wkleić informacje o atrakcjach,
      nawierzchni, rodzinnych miejscach,
      punktach widokowych itd.
    </p>

    <a class="btn">Pobierz GPX</a>

  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* 🗺️ START MAPY */
var map = L.map('map').setView([50.06, 19.94], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

/* 🔥 DANE TRAS */
const trasy = [
  {
    name: "Puszcza Niepołomicka",
    lat: 50.05,
    lng: 20.22,
    km: 42,
    elevation: 240,
    img: "https://picsum.photos/600/300"
  }
];

/* 📍 MARKERY */
trasy.forEach(t => {

  let marker = L.marker([t.lat, t.lng]).addTo(map);

  marker.on('click', () => {
    showPanel(t);
  });

});

/* 📦 PANEL */
function showPanel(t) {

  const panel = document.getElementById("panel");
  const content = document.getElementById("panelContent");

  content.innerHTML = `
    <h3>${t.name}</h3>

    <p>
      📏 ${t.km} km <br>
      ⛰️ ${t.elevation} m
    </p>

    <img src="${t.img}">

    <a class="btn" onclick="openDetails()">
      Zobacz szczegóły
    </a>
  `;

  panel.classList.add("open");

}

/* 📄 OTWÓRZ SZCZEGÓŁY */
function openDetails() {
  document.getElementById("details").style.display = "block";
}

/* ❌ ZAMKNIJ SZCZEGÓŁY */
function closeDetails() {
  document.getElementById("details").style.display = "none";
}

/* 👆 OTWIERANIE / ZAMYKANIE PANELU */
document.getElementById("handle").onclick = () => {
  document.getElementById("panel").classList.toggle("open");
};

</script>

</body>
</html>
