# Responsive logo + layout dla „W wolnej chwili”

Poniżej masz gotowe rozwiązanie do wklejenia na stronę.

---

# 1. LOGO SVG (RESPONSIVE)

👉 Utwórz plik:

```plaintext
/logo.svg
```

👉 Wklej do niego:

```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- ikona -->
  <g transform="translate(20,20)">
    <circle cx="120" cy="60" r="18" fill="url(#sun)"/>

    <path d="M20 130 Q120 20 220 130"
          fill="none"
          stroke="#0f3d2e"
          stroke-width="8"
          stroke-linecap="round"/>

    <path d="M70 130 L120 80 L170 130"
          fill="none"
          stroke="#0f3d2e"
          stroke-width="8"
