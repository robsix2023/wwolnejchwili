      trasy • rower • bieganie • wolny czas
    </text>
  </g>
</svg>
```

---

# 2. RESPONSYWNE WSTAWIENIE LOGO

👉 W `index.html`:

```html
<div class="logo-wrapper">
  <img src="logo.svg" alt="W wolnej chwili" class="logo">
</div>
```

---

# 3. RESPONSYWNY CSS (BARDZO WAŻNE)

👉 Wklej do CSS:

```css
/* RESET */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* LOGO */
.logo-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 16px 10px;
  background: white;
}

.logo {
  width: 100%;
  max-width: 520px;
  height: auto;
  display: block;
}

/* FILTRY */
#filters {
  width: 100%;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 16px;
  background: white;
}

.filter {
  flex-shrink: 0;
  padding: 10px 14px;
  border-radius: 999px;
  background: #ececec;
  font-size: 14px;
  white-space: nowrap;
}

/* MAPA */
#map {
  width: 100%;
  height: 55vh;
}

/* PANEL */
#panel {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 120px;
  background: white;
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -2px 20px rgba(0,0,0,0.15);
  transition: 0.3s;
  overflow-y: auto;
  z-index: 1000;
}

#panel.open {
  height: 65vh;
}

#panelContent {
  padding: 16px;
}

#panel img {
  width: 100%;
  border-radius: 14px;
  margin-top: 10px;
}

/* SZCZEGÓŁY */
#details {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: white;
  overflow-y: auto;
  z-index: 2000;
}

#detailsContent {
  padding: 16px;
  max-width: 900px;
  margin: auto;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}

.gallery img {
  width: 100%;
  border-radius: 12px;
}

/* PRZYCISKI */
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  text-align: center;
  background: #0f3d2e;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
}

/* TABLET */
@media (min-width: 768px) {

  #map {
    height: 65vh;
  }

  #panel {
    width: 420px;
    right: 20px;
    left: auto;
    bottom: 20px;
    border-radius: 24px;
    height: 160px;
  }

  #panel.open {
    height: 70vh;
  }
}

/* DUŻE MONITORY */
@media (min-width: 1200px) {

  .logo {
    max-width: 650px;
  }

  #map {
    height: 72vh;
  }
}
```

